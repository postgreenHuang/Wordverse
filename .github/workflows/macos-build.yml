name: Build macOS Apple Silicon app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/macos-build.yml'

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: macOS Apple Silicon (.dmg)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --run
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Build unsigned DMG
        run: npm run desktop:build -- --bundles dmg
      - name: Write SHA-256 checksum
        run: shasum -a 256 src-tauri/target/release/bundle/dmg/*.dmg > src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Wordverse-macos-arm64-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
