name: Build macOS Apple Silicon app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: macOS Apple Silicon (.dmg + .app.zip)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test -- --run
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"
      - name: Build macOS app bundle
        run: npm run desktop:build -- --bundles app
      - name: Verify and ad-hoc sign app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          test -x "$APP_PATH/Contents/MacOS/$EXECUTABLE_NAME"
          test -d "$APP_PATH/Contents/Resources"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "APP_NAME=$(basename "$APP_PATH")" >> "$GITHUB_ENV"
      - name: Package app zip without losing macOS metadata
        shell: bash
        run: |
          mkdir -p src-tauri/target/release/bundle/artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "src-tauri/target/release/bundle/artifacts/Wordverse-macos-arm64.app.zip"
      - name: Create DMG from verified app
        shell: bash
        run: |
          set -euo pipefail
          STAGING_DIR="$(mktemp -d)"
          trap 'rm -rf "$STAGING_DIR"' EXIT
          ditto "$APP_PATH" "$STAGING_DIR/$APP_NAME"
          ln -s /Applications "$STAGING_DIR/Applications"
          hdiutil create -volname "Wordverse" -srcfolder "$STAGING_DIR" -ov -format UDZO "src-tauri/target/release/bundle/artifacts/Wordverse-macos-arm64.dmg"
      - name: Mount DMG and verify packaged executable
        shell: bash
        run: |
          set -euo pipefail
          MOUNT_DIR="$(mktemp -d)"
          trap 'hdiutil detach "$MOUNT_DIR" -quiet || true; rm -rf "$MOUNT_DIR"' EXIT
          hdiutil attach "src-tauri/target/release/bundle/artifacts/Wordverse-macos-arm64.dmg" -mountpoint "$MOUNT_DIR" -nobrowse -readonly
          PACKAGED_APP="$MOUNT_DIR/$APP_NAME"
          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PACKAGED_APP/Contents/Info.plist")"
          test -x "$PACKAGED_APP/Contents/MacOS/$EXECUTABLE_NAME"
          codesign --verify --deep --strict --verbose=2 "$PACKAGED_APP"
          hdiutil detach "$MOUNT_DIR" -quiet
      - name: Write SHA-256 checksums
        working-directory: src-tauri/target/release/bundle/artifacts
        run: shasum -a 256 Wordverse-macos-arm64.dmg Wordverse-macos-arm64.app.zip > SHA256SUMS.txt
      - name: Upload verified macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: Wordverse-macos-arm64-${{ github.sha }}
          path: src-tauri/target/release/bundle/artifacts/*
          if-no-files-found: error
          retention-days: 30
